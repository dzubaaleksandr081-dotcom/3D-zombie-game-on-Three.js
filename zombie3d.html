<head>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<style>
  html,body{margin:0;height:100%;background:#c49a5e;overflow:hidden;touch-action:none;font-family:Arial;color:#fff}
  canvas{display:block}
  #hud{position:fixed;top:0;left:0;right:0;padding:8px 12px;background:#00000088;display:flex;justify-content:space-between;align-items:center;z-index:5}
  #hpbar{width:180px;height:16px;background:#333;border-radius:8px;overflow:hidden}
  #hpfill{height:100%;width:100%;background:#2ecc71;transition:width .2s}
  .screen{position:fixed;inset:0;display:none;flex-direction:column;gap:10px;align-items:center;justify-content:center;z-index:8;background:#000000c9;overflow:auto;padding:20px 0}
  .screen button{padding:12px 26px;font-size:18px;border-radius:10px;border:0;background:#2ecc71;color:#fff;min-width:200px}

  .gcar.sel{border-color:#ffd700;background:#2c7fb8}
  .up{background:#8e44ad;min-width:260px}
  .small{background:#333;font-size:14px;padding:8px 16px;min-width:0}
  .mapBtn{background:#7f5f2e;min-width:200px;font-size:14px;padding:8px 14px;border:3px solid transparent}
  .mapBtn.sel{border-color:#ffd700;background:#5f4520}
  #over,#pause{background:#000000dd}
  #pause h1{font-size:44px;color:#f39c12;margin:0}
  #intro{background:#000}
  #garage{background:#00000088}
  #mute,#pauseBtn{position:fixed;z-index:10;background:#26262c;border:2px solid #4a4a55;
    border-radius:10px;color:#fff;width:56px;height:48px;align-items:center;justify-content:center}
  #mute{top:64px;right:10px;display:flex}
  #pauseBtn{top:64px;right:72px;display:none;gap:6px}
  #pauseBtn:before,#pauseBtn:after{content:"";width:8px;height:22px;background:#e8e8e8;border-radius:2px}
  #ctrls{position:fixed;bottom:0;left:0;right:0;display:none;justify-content:space-between;align-items:flex-end;padding:0 16px 18px;z-index:6;pointer-events:none}
  #wheel{pointer-events:auto;width:150px;height:150px;border-radius:50%;position:relative;
    background:radial-gradient(circle at 30% 30%,#3d3d3d,#141414 70%);
    box-shadow:inset 0 0 0 5px #2a2a2a,inset 0 0 0 8px #0c0c0c,0 4px 12px #00000088}
  #wheelHub{position:absolute;inset:0;border-radius:50%}
  #wheelHub:before{content:"";position:absolute;left:50%;top:6%;width:16%;height:88%;
    background:linear-gradient(90deg,#1f1f1f,#3c3c3c,#1f1f1f);transform:translateX(-50%);border-radius:4px}
  #wheelHub:after{content:"";position:absolute;top:50%;left:6%;width:88%;height:16%;
    background:linear-gradient(0deg,#1f1f1f,#3c3c3c,#1f1f1f);transform:translateY(-50%);border-radius:4px}
  #wheelCap{position:absolute;left:50%;top:50%;width:36%;height:36%;transform:translate(-50%,-50%);
    border-radius:50%;background:radial-gradient(circle at 35% 35%,#e8b830,#8a6d10 75%);
    box-shadow:0 0 6px #000,inset 0 0 4px #ffffff55;z-index:2;text-align:center;
    line-height:38px;font-size:11px;font-weight:bold;color:#141414}
  #gasBtn{pointer-events:auto;width:110px;height:140px;border-radius:12px;border:4px solid #3a3f46;
    background:linear-gradient(#5a5f66,#23272d);position:relative;overflow:hidden;user-select:none}
  #gasBtn:before{content:"";position:absolute;left:10px;right:10px;top:12px;height:104px;border-radius:8px;
    background:repeating-linear-gradient(180deg,#2b3037 0 10px,#42484f 10px 14px);
    box-shadow:inset 0 0 0 3px #565d66}
  #gasBtn span{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:14px;
    font-weight:bold;color:#e8e8e8;z-index:2}
  #gasBtn:active{transform:scale(.94);filter:brightness(1.3)}
  #banner{position:fixed;top:30%;left:0;right:0;text-align:center;font-size:34px;font-weight:bold;color:#ffd700;z-index:7;opacity:0;transition:opacity .5s;pointer-events:none;text-shadow:0 2px 8px #000}
  input[type=range]{width:260px}
  #mpList,#mapPick{display:flex;flex-direction:column;gap:8px;align-items:center}
  #errBar{position:fixed;bottom:0;left:0;right:0;background:#b02020e6;color:#fff;font:12px Arial;
    padding:6px 10px;z-index:99;display:none;max-height:40vh;overflow:auto}
  #optLine{position:fixed;top:40px;left:0;right:0;text-align:center;font:11px Arial;
    color:#7fff9f;z-index:6;display:none;pointer-events:none;text-shadow:0 1px 2px #000}
</style>
</head>

<script>
// =================  =================
let lastErrT=0;
function reportErr(msg){
  const n=performance.now();
  if(n-lastErrT<2000)return;
  lastErrT=n;
  const el=document.getElementById("errBar");
  if(el){el.style.display="block";el.textContent=": "+msg;}
}
window.addEventListener("error",function(e){
  let extra="";
  try{
    if(e.error&&e.error.stack){
      extra=" || "+e.error.stack.split("\n").filter(function(s){return s.trim();}).slice(1,3).join(" | ");
    }
  }catch(x){}
  reportErr(e.message+extra);
});
if(typeof THREE==="undefined"){
  document.body.innerHTML="<div style='color:#fff;background:#202020;padding:40px;font-size:18px'>   Three.js —     .</div>";
  throw new Error("THREE  ");
}

// =================  =================
const cv=document.getElementById("c");
let gfxIdx=1;
try{gfxIdx=+localStorage.getItem("z3d_gfx");if(isNaN(gfxIdx))gfxIdx=1;}catch(e){}
const GFX=[{n:"",pr:0.7,sh:false,aa:false},{n:"",pr:1,sh:false,aa:true},{n:"",pr:2,sh:true,aa:true}];
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:GFX[gfxIdx].aa,powerPreference:"high-performance"});
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xd9a05f);
scene.fog=new THREE.Fog(0xd9a05f,80,600);
const cam=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,0.1,700);
scene.add(cam);
onresize=()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);};
renderer.setSize(innerWidth,innerHeight);

const hemi=new THREE.HemisphereLight(0xffd9b0,0x6b4a2a,1.0);scene.add(hemi);
const dirLight=new THREE.DirectionalLight(0xffd2a0,1.2);dirLight.position.set(40,60,-30);scene.add(dirLight);
const fill=new THREE.DirectionalLight(0x8a7db8,0.3);fill.position.set(-25,30,30);scene.add(fill);

// =================   =================
function noiseTex(base,vary,rep){
  const c=document.createElement("canvas");c.width=c.height=128;
  const x=c.getContext("2d");
  x.fillStyle=base;x.fillRect(0,0,128,128);
  for(let i=0;i<700;i++){
    const v=vary+((Math.random()*60)|0);
    x.fillStyle="rgba("+v+","+v+","+v+","+(0.05+Math.random()*0.14).toFixed(2)+")";
    x.fillRect(Math.random()*128,Math.random()*128,2+Math.random()*4,2+Math.random()*4);
  }
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep,rep);
  return t;
}
function bodyTexFn(base){
  const c=document.createElement("canvas");c.width=c.height=128;
  const x=c.getContext("2d");
  x.fillStyle=base;x.fillRect(0,0,128,128);
  for(let i=0;i<200;i++){
    x.fillStyle="rgba(255,255,255,"+(Math.random()*0.05).toFixed(2)+")";
    x.fillRect(Math.random()*128,Math.random()*128,2,2);
  }
  for(let i=0;i<14;i++){
    x.strokeStyle="rgba(40,30,20,"+(0.1+Math.random()*0.25).toFixed(2)+")";
    x.lineWidth=1;x.beginPath();
    const px=Math.random()*128,py=Math.random()*128;
    x.moveTo(px,py);x.lineTo(px+(Math.random()-0.5)*24,py+(Math.random()-0.5)*8);x.stroke();
  }
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  return t;
}

const ground=new THREE.Mesh(new THREE.PlaneGeometry(400,400),
  new THREE.MeshStandardMaterial({color:0xffffff,map:noiseTex("#d0a066",170,50),roughness:1}));
ground.rotation.x=-Math.PI/2;ground.position.y=-0.02;ground.receiveShadow=true;scene.add(ground);
const road=new THREE.Mesh(new THREE.PlaneGeometry(26,400),
  new THREE.MeshStandardMaterial({color:0xffffff,map:noiseTex("#8a7350",105,26),roughness:0.95}));
road.rotation.x=-Math.PI/2;scene.add(road);
const dashes=[];
for(let i=-200;i<200;i+=12){
  const d=new THREE.Mesh(new THREE.PlaneGeometry(0.4,3),new THREE.MeshBasicMaterial({color:0xe8d44d}));
  d.rotation.x=-Math.PI/2;d.position.set(0,0.01,i);scene.add(d);dashes.push(d);
}

// =================    =================
let peerLoading=false,peerLoaded=false;
function loadPeer(cb){
  if(peerLoaded){cb();return;}
  if(peerLoading){const iv=setInterval(()=>{if(peerLoaded){clearInterval(iv);cb();}},200);return;}
  peerLoading=true;
  const s=document.createElement("script");
  s.src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js";
  s.onload=()=>{peerLoaded=true;
    document.getElementById("mpLoad").textContent=" ";
    cb();};
  s.onerror=()=>{
    document.getElementById("mpLoad").textContent="    —  ";
    peerLoading=false;};
  document.head.appendChild(s);
}
function enterMp(){
  document.getElementById("mpLoad").textContent="  ...";
  openScr("mp");
  loadPeer(()=>{});
}

// =================     =================
const _mC={},_gC={};
function rmat(c){return _mC[c]||(_mC[c]=new THREE.MeshStandardMaterial({color:c,roughness:0.95}));}
function rbox(g,w,h,d,c,x,y,z,ry,rz){
  const k=w+"_"+h+"_"+d;
  const geo=_gC[k]||(_gC[k]=new THREE.BoxGeometry(w,h,d));
  const m=new THREE.Mesh(geo,rmat(c));
  m.position.set(x,y,z);
  if(ry)m.rotation.y=ry;
  if(rz)m.rotation.z=rz;
  g.add(m);return m;
}
function rcyl(g,r1,r2,h,c,x,y,z,rz){
  const k="c"+r1+"_"+r2+"_"+h;
  const geo=_gC[k]||(_gC[k]=new THREE.CylinderGeometry(r1,r2,h,12));
  const m=new THREE.Mesh(geo,rmat(c));
  m.position.set(x,y,z);
  if(rz)m.rotation.z=rz;
  g.add(m);return m;
}

// =================  =================
const MAPS=[
 {n:"",fog:0xd9a05f,ruins:18,obMul:1.0,rateMul:1.0,desc:" "},
 {n:" ",fog:0x2a2438,ruins:24,obMul:1.6,rateMul:1.25,desc:"  "},
 {n:"",fog:0xc9762e,ruins:11,obMul:0.6,rateMul:0.8,desc:",  "}
];
let mapIdx=0;
function buildMaps(){
  const bx=document.getElementById("mapPick");bx.innerHTML="";
  MAPS.forEach((m,i)=>{
    const b=document.createElement("button");
    b.className="mapBtn"+(i===mapIdx?" sel":"");
    b.textContent=m.n+" — "+m.desc;
    b.onclick=()=>{mapIdx=i;buildMaps();setTod(tod);applyGfx();};
    bx.appendChild(b);
  });
}
buildMaps();
function applyMap(i){
  mapIdx=Math.max(0,Math.min(MAPS.length-1,i));
  setTod(tod);applyGfx();
}

// =================  =================
let bloodCount=12;
const lampMeshes=[];
function cycleGfx(){
  gfxIdx=(gfxIdx+1)%3;applyGfx();
  document.getElementById("gfxBtn").textContent=": "+GFX[gfxIdx].n;
  try{localStorage.setItem("z3d_gfx",gfxIdx);}catch(e){}
}
function applyGfx(){
  const g=GFX[gfxIdx];bloodCount=[8,12,18][gfxIdx];
  renderer.setPixelRatio(Math.min(devicePixelRatio,g.pr));
  renderer.shadowMap.enabled=g.sh;
  dirLight.castShadow=g.sh;
  if(g.sh){dirLight.shadow.mapSize.set(512,512);const sc=dirLight.shadow.camera;sc.left=-30;sc.right=30;sc.top=40;sc.bottom=-40;}
  ruins.forEach((r,i)=>r.visible=(gfxIdx>0||i<12)&&(i<MAPS[mapIdx].ruins));
  rocks.forEach((r,i)=>r.visible=gfxIdx>0||i<10);
  cityBg.forEach((b,i)=>b.visible=gfxIdx>0||i<12);
  setTod(tod);
}

// ================= / +     =================
let tod=22;
try{tod=+localStorage.getItem("z3d_tod");if(isNaN(tod))tod=22;}catch(e){}
let skyCustom=false;
const coneMats=[],beamLights=[],lampMats=[];
function setTod(h){
  tod=h;try{localStorage.setItem("z3d_tod",tod);}catch(e){}
  const lb=document.getElementById("todLabel");
  if(lb)lb.textContent=
    String(Math.floor(h)).padStart(2,"0")+":"+String(Math.round(h%1*60)).padStart(2,"0");
  const dl=Math.max(0,Math.sin((h-6)/12*Math.PI));
  const sky=new THREE.Color(0x1a1030).lerp(new THREE.Color(0xf0a860),dl*0.9);
  const f=sky.clone().lerp(new THREE.Color(MAPS[mapIdx].fog),0.5);
  if(!skyCustom)scene.background=f;
  scene.fog.color=f;
  dirLight.intensity=0.4+dl*1.2;
  dirLight.color.copy(new THREE.Color(0xd0a0ff).lerp(new THREE.Color(0xffd9a0),dl));
  hemi.intensity=0.55+dl*0.75;
  fill.intensity=0.2+dl*0.25;
  stars.material.opacity=1-dl;
  moon.visible=dl<0.5;sunMesh.visible=dl>0.2;
  const nightF=1-dl;
  coneMats.forEach(m=>m.opacity=0.02+0.1*nightF);
  beamLights.forEach(l=>l.intensity=0.5+1.2*nightF);
  lampMats.forEach(m=>m.color.setHex(nightF>0.3?0xfff6d0:0xcccccc));
  const haloVis=(nightF>0.15)&&(gfxIdx>0);
  lampMeshes.forEach(m=>m.visible=haloVis);
}
document.getElementById("tod").value=tod;

document.getElementById("skyInput").addEventListener("change",function(){
  const f=this.files[0];
  if(!f)return;
  const url=URL.createObjectURL(f);
  new THREE.TextureLoader().load(url,t=>{
    t.mapping=THREE.EquirectangularReflectionMapping;
    scene.background=t;
    skyCustom=true;
    const img=new Image();
    img.onload=()=>{
      try{
        const cnv=document.createElement("canvas");
        cnv.width=cnv.height=8;
        const ctx=cnv.getContext("2d");
        ctx.drawImage(img,0,0,8,8);
        const d=ctx.getImageData(0,0,8,8).data;
        let r=0,g=0,b=0,n=0;
        for(let i=0;i<d.length;i+=4){r+=d[i];g+=d[i+1];b+=d[i+2];n++;}
        scene.fog.color.setRGB(r/n/255,g/n/255,b/n/255);
        document.getElementById("skyBtn").textContent="   ";
      }catch(e){}
    };
    img.src=url;
  });
});
function resetSky(){
  skyCustom=false;
  setTod(tod);
  document.getElementById("skyBtn").textContent=" ";
}

// =================  =================
const CARS=[

function makeRuin(){
  const g=new THREE.Group();
  const t=Math.random();
  const RB=0x8f7350,RS=0xb09877,RD=0x4a3a28;
  function windowHole(gg,x,y,z){
    rbox(gg,1.1,1.4,0.12,0x1c140c,x,y,z);
    rbox(gg,0.12,1.5,0.16,RS,x-0.6,y,z-0.02);
    rbox(gg,0.12,1.5,0.16,RS,x+0.6,y,z-0.02);
    rbox(gg,1.3,0.12,0.16,RS,x,y+0.75,z-0.02);
  }
  function rubble(gg,x,z,spread,n){
    for(let i=0;i<n;i++){
      const s=0.2+Math.random()*0.5;
      rbox(gg,s,s*0.75,s,RB-((Math.random()*0x0a0a0a)|0),
        x+(Math.random()-0.5)*spread,s*0.35,z+(Math.random()-0.5)*spread,
        (Math.random()-0.5),Math.random()*0.4-0.2);
    }
  }
  if(t<0.5){
    rbox(g,3.2,3.2,3.2,RB,0,1.6,0);
    windowHole(g,-0.8,1.8,-1.62);
    windowHole(g,0.8,1.8,-1.62);
    rbox(g,3.4,0.3,3.4,RS,0,3.3,0);
    rubble(g,0,2,2.5,6);
  } else {
    rbox(g,4.2,5.5,3.6,RB,0,2.75,0);
    windowHole(g,-1.2,2.2,-1.82);
    windowHole(g,1.2,2.2,-1.82);
    windowHole(g,-1.2,4.2,-1.82);
    rbox(g,4.4,0.3,3.8,RS,0,5.6,0);
    for(let i=0;i<3;i++)rcyl(g,0.035,0.035,0.7,RD,(Math.random()-0.5)*2,5.8,-1.4);
    rubble(g,0,2.2,3.4,8);
  }
  return g;
}

let actx=null,master,noiseBuf,step=0,nt=0,muted=false;
let engOsc,engSub,engLfo,engMaster,exhaustGain;
function initAudio(){
  if(actx)return;
  try{
    actx=new (window.AudioContext||window.webkitAudioContext)();
  }catch(e){return;}
  master=actx.createGain();master.gain.value=0.4;
  const dr=actx.createWaveShaper(),cur=new Float32Array(256);
  for(let i=0;i<256;i++)cur[i]=Math.tanh((i*2/256-1)*3);
  dr.curve=cur;master.connect(dr).connect(actx.destination);
  noiseBuf=actx.createBuffer(1,actx.sampleRate*0.5,actx.sampleRate);
  const d=noiseBuf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  engMaster=actx.createGain();engMaster.gain.value=0;engMaster.connect(master);
  engOsc=actx.createOscillator();engOsc.type="sawtooth";engOsc.frequency.value=60;
  const ef=actx.createBiquadFilter();ef.type="lowpass";ef.frequency.value=260;ef.Q.value=1.2;
  engOsc.connect(ef).connect(engMaster);engOsc.start();
  engSub=actx.createOscillator();engSub.type="triangle";engSub.frequency.value=30;
  const sg=actx.createGain();sg.gain.value=0.6;engSub.connect(sg).connect(engMaster);engSub.start();
  const ex=actx.createBufferSource();ex.buffer=noiseBuf;ex.loop=true;
  const xf=actx.createBiquadFilter();xf.type="bandpass";xf.frequency.value=140;xf.Q.value=0.6;
  exhaustGain=actx.createGain();exhaustGain.gain.value=0;
  ex.connect(xf).connect(exhaustGain).connect(engMaster);ex.start();
  engLfo=actx.createOscillator();engLfo.type="sawtooth";engLfo.frequency.value=30;
  const lg=actx.createGain();lg.gain.value=0.4;engLfo.connect(lg).connect(engMaster.gain);engLfo.start();
  nt=actx.currentTime+0.1;setInterval(musicStep,40);
}

function engineSound(th){
  if(!actx)return;const t=actx.currentTime;
  const off=muted||!playing||paused;
  const rpm=off?0.12:0.15+th*0.85;
  const f=22+rpm*130;
  engOsc.frequency.setTargetAtTime(f,t,0.08);
  engSub.frequency.setTargetAtTime(f/2,t,0.08);
  engLfo.frequency.setTargetAtTime(f,t,0.08);
  engMaster.gain.setTargetAtTime(off?0:0.42+th*0.2,t,0.1);
  exhaustGain.gain.setTargetAtTime(off?0:0.06+th*0.14,t,0.1);
}
const NOTE={E2:82.4,G2:98,A2:110,B2:123.5,D3:146.8};
const riff=[NOTE.E2,NOTE.E2,NOTE.G2,NOTE.E2,NOTE.A2,NOTE.E2,NOTE.B2,NOTE.A2,
            NOTE.E2,NOTE.E2,NOTE.G2,NOTE.E2,NOTE.D3,NOTE.B2,NOTE.A2,NOTE.G2];
function gtr(t,f,d,v){
  const o=actx.createOscillator(),o2=actx.createOscillator(),g=actx.createGain();
  o.type="sawtooth";o.frequency.value=f;
  o2.type="square";o2.frequency.value=f*2.01;
  const g2=actx.createGain();g2.gain.value=0.35;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);
  o.connect(g);o2.connect(g2).connect(g);g.connect(master);
  o.start(t);o2.start(t);o.stop(t+d);o2.stop(t+d);
}
function kick(t){
  const o=actx.createOscillator(),g=actx.createGain();
  o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+0.08);
  g.gain.setValueAtTime(1,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.18);
  o.connect(g).connect(master);o.start(t);o.stop(t+0.2);
}
function snare(t){
  const s=actx.createBufferSource(),f=actx.createBiquadFilter(),g=actx.createGain();
  s.buffer=noiseBuf;f.type="bandpass";f.frequency.value=1800;
  g.gain.setValueAtTime(0.5,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.13);
  s.connect(f).connect(g).connect(master);s.start(t);s.stop(t+0.15);
}

function toggleTrack(){
  if(!trackAudio){document.getElementById("trackBtn").textContent="  ";return;}
  trackPlaying=!trackPlaying;
  if(trackPlaying){trackAudio.play();document.getElementById("trackBtn").textContent="";}
  else{trackAudio.pause();document.getElementById("trackBtn").textContent=" ";}
}
function musicStep(){
  if(muted||!actx)return;
  if(trackPlaying)return;
  if(!playing&&!garageOpen)return;
  while(nt<actx.currentTime+0.25){
    const s=step%16,t=nt;
    if(s%4===0)kick(t);
    if(s===4||s===12)snare(t);
    if(riff[s])gtr(t,riff[s],0.12,playing?0.2:0.13);
    step++;nt+=0.125;
  }
}
function killSound(){
  if(!actx||muted)return;const t=actx.currentTime;
  const s=actx.createBufferSource(),f=actx.createBiquadFilter(),g=actx.createGain();
  s.buffer=noiseBuf;f.type="bandpass";f.Q.value=2;
  f.frequency.setValueAtTime(1100+Math.random()*500,t);
  f.frequency.exponentialRampToValueAtTime(110,t+0.12);
  g.gain.setValueAtTime(0.6,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.15);
  s.connect(f).connect(g).connect(master);s.start(t);s.stop(t+0.16);
  const o=actx.createOscillator(),g2=actx.createGain();
  o.type="sine";o.frequency.setValueAtTime(170+Math.random()*60,t);
  o.frequency.exponentialRampToValueAtTime(50,t+0.1);
  g2.gain.setValueAtTime(0.5,t);g2.gain.exponentialRampToValueAtTime(0.001,t+0.11);
  o.connect(g2).connect(master);o.start(t);o.stop(t+0.13);
}

function onNetData(d){
  if(mpState!=="net"||isHost)return;
  if(d.m!==undefined&&d.m!==mapIdx)applyMap(d.m);
  const byId={};
  for(const zz of zombies)byId[zz.userData.id]=zz;
  const seen={};
  for(const z of d.z){
    seen[z.id]=true;
    let ex=byId[z.id];
    if(!ex)ex=makeZombie(z.x,z.z);
    ex.userData.id=z.id;ex.userData.speed=z.s;
    ex.position.set(z.x,0,z.z);
  }
  for(let i=zombies.length-1;i>=0;i--)
    if(!seen[zombies[i].userData.id]){scene.remove(zombies[i]);zombies.splice(i,1);}
  const obKey={};
  for(const oo of obstacles)obKey[oo.position.x+"_"+oo.position.z]=oo;
  const obSeen={};
  for(const o of d.ob){
    obSeen[o.x+"_"+o.z]=true;
    if(!obKey[o.x+"_"+o.z])makeObstacle(o.x,o.z);
  }
  for(let i=obstacles.length-1;i>=0;i--){
    const o=obstacles[i];
    if(!obSeen[o.position.x+"_"+o.position.z]&&o.position.z>-100){scene.remove(o);obstacles.splice(i,1);}

}

const wheelEl=document.getElementById("wheel"),hubEl=document.getElementById("wheelHub");

function angOf(e){
  const t=(e.touches&&e.touches[0])?e.touches[0]:e;
  const r=wheelEl.getBoundingClientRect();
  return Math.atan2(t.clientY-(r.top+r.height/2),t.clientX-(r.left+r.width/2));
}
function wheelDown(e){
  e.preventDefault&&e.preventDefault();
  wheelActive=true;wheelStart=angOf(e);
  try{wheelEl.setPointerCapture(e.pointerId);}catch(x){}
}
function wheelMove(e){
  if(!wheelActive)return;
  e.preventDefault&&e.preventDefault();
  let d=angOf(e)-wheelStart;
  while(d>Math.PI)d-=2*Math.PI;
  while(d<-Math.PI)d+=2*Math.PI;
  steerVal=Math.max(-1,Math.min(1,d/(Math.PI*0.8)));
  hubEl.style.transform="rotate("+d+"rad)";
}

// =================   () =================
const clock=new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  try{
    tick();
  }catch(err){
    reportErr((err&&err.message||err)+" —   ");
  }
}
function tick(){
  const dt=Math.min(clock.getDelta(),0.05);
  const now=performance.now();
  const c=CARS[carIdx];

  if(!wheelActive&&steerVal!==0){
    steerVal*=0.88;
    if(Math.abs(steerVal)<0.02)steerVal=0;
    hubEl.style.transform="rotate("+(steerVal*Math.PI*0.8)+"rad)";
  }

  perfTick(dt);

  if(introActive){
    introT+=dt;const T=introT;
    const fr=Math.min(1,T/1.1);
    introFire.scale.setScalar(1+fr*30);
    introFire.material.color.setHSL(0.13-fr*0.13,1,Math.max(0.05,0.9-fr*0.6));
    introFire.material.opacity=Math.max(0,1-Math.max(0,(T-2.2)/2.6));
    const sh=Math.min(1,T/2.6);
    stem.scale.set(1+sh*1.6,Math.min(1,T/2.8)*70,1+sh*1.6);
    stem.position.y=stem.scale.y/2;
    const cr=Math.min(1,T/3.4);
    capM.scale.setScalar(0.01+cr*30);
    capM.position.y=30+cr*24;
    capM.material.color.setHSL(0.09-cr*0.09,0.55,Math.max(0.08,0.5-cr*0.3));
    if(T>1.3){
      if(!shockFlashed){
        shockFlashed=true;
        flashDiv.style.transition="opacity .1s";
        flashDiv.style.background="#ffd9a0";
        flashDiv.style.opacity="0.55";
        setTimeout(()=>{flashDiv.style.transition="opacity .9s";flashDiv.style.opacity="0";},120);
      }
      const wr=Math.min(1,(T-1.3)/2.6);
      ring.scale.setScalar(1+wr*120);
      ring.material.opacity=0.6*(1-wr);
    }
    boomLight.intensity=Math.max(0,3-T)*6;
    const k=Math.min(1,T*2);
    cam.position.set(0+(Math.random()-0.5)*0.7*k,6+(Math.random()-0.5)*0.5*k,20+(Math.random()-0.5)*0.7*k);
    cam.lookAt(40,30,-260);
    if(T>6){flashDiv.style.transition="opacity .8s";flashDiv.style.background="#000";flashDiv.style.opacity=Math.min(0.85,(T-6)/1.2);}
    if(T>7.5)endIntro();
    renderer.render(scene,cam);
    return;
  }

  for(const f of fires){
    f.ph+=dt*9;
    f.flames.forEach((fl,i)=>{
      fl.scale.y=0.8+Math.sin(f.ph+i*1.7)*0.3;
      fl.scale.x=fl.scale.z=0.9+Math.cos(f.ph*1.3+i)*0.2;
    });
    if(f.light)f.light.intensity=1.2+Math.sin(f.ph*2.3)*0.5;
  }
  const sT=now/1000;
  for(const s of smokes){
    const u=s.userData;
    const k2=((sT*0.8+u.ph)%3)/3;
    s.position.y=u.y0+k2*5;
    s.position.x=u.x+Math.sin(sT+u.ph)*0.5;
    s.material.opacity=0.35*(1-k2);
    s.scale.setScalar(0.8+k2*1.6);
  }

  if(garageMode){
    const t2=now/1000;
    cam.position.set(GAR.x+9.5+Math.sin(t2*0.3)*0.6,3.6,GAR.z+2.5);
    cam.lookAt(GAR.x,1.4,GAR.z);
    if(garLamp)garLamp.intensity=2.2+Math.sin(t2*7)*0.25;
    renderer.render(scene,cam);
    return;
  }

  if(!playing){
    if(over){renderer.render(scene,cam);return;}
    const a=now/4000;
    cam.position.set(Math.sin(a)*8,4.5,Math.cos(a)*8);
    cam.lookAt(0,1.5,0);
    carGroup.rotation.y+=dt*0.4;
    renderer.render(scene,cam);
    return;
  }
  if(paused){renderer.render(scene,cam);return;}

  const spdMul=(1+0.15*UPG.engine)*c.speed;
  const worldSpeed=gasOn?1.5*spdMul:0;

  if(steerVal!==0)carTX=Math.max(-10,Math.min(10,carTX+steerVal*9*spdMul*dt));
  const mv=Math.max(-7*spdMul,Math.min(7*spdMul,(carTX-carX)*3*spdMul))*dt*(gasOn?1:0.3);
  carX+=mv;carX=Math.max(-10,Math.min(10,carX));
  carGroup.position.x=carX;
  const targetTilt=-steerVal*0.35;
  carGroup.rotation.y+=(targetTilt-carGroup.rotation.y)*Math.min(1,dt*6);
  carGroup.rotation.z+=(-mv*0.04-carGroup.rotation.z)*Math.min(1,dt*5);
  const spin=(Math.abs(mv)/0.5+(gasOn?9:0))*dt*6;
  wheels.forEach(w=>{
    w.rotation.x+=spin;
    if(w.position.z<0)w.rotation.y=steerVal*0.45;
  });

  dashes.forEach(d=>{
    d.position.z+=38*worldSpeed*dt;
    if(d.position.z>10)d.position.z-=210;
  });
  ruins.forEach(r=>{
    r.position.z+=38*worldSpeed*dt;
    if(r.position.z>25){
      r.position.z=-135-Math.random()*35;
      const side=Math.random()<0.5?-1:1;
      r.position.x=side*(26+Math.random()*40);
      r.rotation.y=Math.random()*Math.PI*2;
    }
  });
  rocks.forEach(r=>{
    r.position.z+=38*worldSpeed*dt;
    if(r.position.z>30){
      r.position.z=-160-Math.random()*40;
      const side=Math.random()<0.5?-1:1;
      r.position.x=side*(30+Math.random()*55);
      r.rotation.y=Math.random()*Math.PI;
    }
  });
  for(let i=bloodDecals.length-1;i>=0;i--){
    const d=bloodDecals[i];
    d.position.z+=38*worldSpeed*dt;
    if(d.position.z>10){scene.remove(d);bloodDecals.splice(i,1);}
  }

  engineSound(gasOn?Math.min(1,Math.min(Math.abs(mv)/5,1)+0.8):0.05);
  const fovT=gasOn?65:62;
  fovCur+=(fovT-fovCur)*dt*5;
  if(Math.abs(cam.fov-fovCur)>0.05){cam.fov=fovCur;cam.updateProjectionMatrix();}

  if(!over){
    if(mpState!=="net"||isHost){
      spawnTimer-=dt;
      if(spawnTimer<=0){
        spawnTimer=LEVELS[level].rate*MAPS[mapIdx].rateMul+Math.random()*0.8;
        if(zombies.length<6)makeZombie((Math.random()-0.5)*22,-70-Math.random()*40);
      }
      obTimer-=dt;
      if(obTimer<=0&&obSpawned<LEVELS[level].ob*MAPS[mapIdx].obMul){
        obTimer=3;obSpawned++;
        makeObstacle((Math.random()-0.5)*18,-120-Math.random()*30);
      }
    }
    const halfW=1.9*c.wf;
    for(let i=zombies.length-1;i>=0;i--){
      const z=zombies[i],u=z.userData;
      const spd=u.speed*LEVELS[level].spd;
      z.position.z+=spd*dt;
      const dx=carX-z.position.x;
      z.position.x+=Math.max(-spd*0.8*dt,Math.min(spd*0.8*dt,dx*3*dt));
      z.rotation.y=Math.sin(now/400+u.sway)*0.12+Math.max(-0.5,Math.min(0.5,dx*0.06));
      const wt=now/150+u.sway*4;
      const sw=Math.sin(wt);
      u.armL.rotation.x=sw*0.55-0.2;
      u.armR.rotation.x=-sw*0.55-0.2;
      u.legL.rotation.x=-sw*0.6;
      u.legR.rotation.x=sw*0.6;
      z.rotation.z=sw*0.06;
      z.position.y=Math.abs(sw)*0.06;
      if(z.position.z>-1.6&&z.position.z<2.2){
        if(Math.abs(z.position.x-carX)<halfW){
          if(mpState==="net"&&!isHost)broadcast({type:"hit",id:u.id});
          killAt(i);continue;
        }
      }
      if(z.position.z>6){scene.remove(z);zombies.splice(i,1);}
    }
    for(let i=obstacles.length-1;i>=0;i--){
      const o=obstacles[i];
      o.position.z+=38*worldSpeed*dt;
      if(o.position.z>-2&&o.position.z<2.4&&Math.abs(o.position.x-carX)<1.6+c.wf*0.9){
        scene.remove(o);obstacles.splice(i,1);
        hurt(8*(1-0.25*UPG.armor));crashSound();shake=0.8;continue;
      }
      if(o.position.z>8){scene.remove(o);obstacles.splice(i,1);}
    }
  }

  for(let i=blood.length-1;i>=0;i--){
    const p=blood[i],u=p.userData;
    u.vy-=12*dt;
    p.position.x+=u.vx*dt;p.position.y+=u.vy*dt;p.position.z+=u.vz*dt;
    u.life-=dt;
    if(u.life<=0||p.position.y<0){
      scene.remove(p);blood.splice(i,1);
      if(bloodPool.length<80){p.visible=false;bloodPool.push(p);}
    }
  }

  if(!dragging){camYaw*=0.985;camPitch*=0.985;}
  const r=9+camPitch*4;
  let cx=carX+Math.sin(camYaw)*r;
  let cz=Math.cos(camYaw)*r;
  let cy=5.5+camPitch*4;
  if(shake>0){
    cx+=(Math.random()-0.5)*shake;
    cy+=(Math.random()-0.5)*shake;
    shake*=0.85;
  }
  cam.position.set(cx,cy,cz);
  cam.lookAt(carX*0.9,1.2,-14);
  renderer.render(scene,cam);
}

//  FPS    +   +   
let perfT=0,perfN=0;
function perfTick(dt){
  perfT+=dt;perfN++;
  if(perfT>0.5){
    const cur=perfN/perfT;
    fpsSmooth=fpsSmooth===0?cur:fpsSmooth*0.7+cur*0.3;
    perfT=0;perfN=0;
    const pr=renderer.getPixelRatio(),maxPR=Math.min(devicePixelRatio,GFX[gfxIdx].pr);
    if(fpsSmooth<34&&pr>0.55)renderer.setPixelRatio(Math.max(0.55,pr-0.15));
    else if(fpsSmooth>56&&pr<maxPR)renderer.setPixelRatio(Math.min(maxPR,pr+0.1));
    if(playing){
      const el=document.getElementById("optLine");
      el.style.display="block";
      el.textContent=
        ": "+Math.round(fpsSmooth)+" FPS · "+
        renderer.info.render.calls+"  · "+
        Math.round(renderer.info.render.triangles/1000)+"K  · "+
        " "+renderer.getPixelRatio().toFixed(2)+"x · "+
        " "+zombies.length+"/6 ·   "+bloodPool.length;
    }
  }
  frameCount++;
  if(GFX[gfxIdx].sh){
    dirLight.castShadow=frameCount%2===0;
  }else{
    dirLight.castShadow=false;
  }
}

// ====  ====
applyGfx();
setTod(tod);
openScr("intro");
loop();
</script>
